<h2>🛒 Cart</h2>
<ul id="cart-items"></ul>
<p id="total">Total: ₹0</p>
<button onclick="clearCart()">Clear Cart</button>
<button onclick="sendWhatsApp()">Order on WhatsApp</button>
<h3>Customer Details</h3>

<input type="text" id="name" placeholder="Enter Name"><br><br>
<input type="text" id="address" placeholder="Enter Address"><br><br>
<input type="text" id="mobile" placeholder="Enter Mobile"><br><br>

<footer>© 2026 Fresh Veg</footer>
<script>
function sendWhatsApp() {

  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;
  let mobile = document.getElementById("mobile").value;

  if (!name || !address || !mobile) {
    alert("Please fill all details ");
    return;
  }

  if (cart.length === 0) {
    alert("Cart empty hai ");
    return;
  }

  let message = " Order Details:%0A%0A";

  message += " Name: " + name + "%0A";
  message += "Address: " + address + "%0A";
  message += " Mobile: " + mobile + "%0A%0A";

  cart.forEach(item => {
    message += `${item.name} - ${item.qty} kg%0A`;
  });

  let total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

  message += `%0ATotal: ₹${total}`;

  let phone = "918400073204"; 

  let url = `https://wa.me/${phone}?text=${message}`;

  window.open(url, "_blank");
}
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price) {
  let item = cart.find(i => i.name === name);

  if (item) {
    item.qty += 1;
  } else {
    cart.push({name, price, qty: 1});
  }

  updateCart();
}

function updateCart() {
  let list = document.getElementById("cart-items");
  let total = document.getElementById("total");

  if (!list || !total) return;  

  list.innerHTML = "";
  let sum = 0;

  cart.forEach((item, index) => {
    let li = document.createElement("li");

    li.innerHTML = `
      ${item.name} - ₹${item.price} x ${item.qty} kg
      <button onclick="changeQty(${index}, 1)">➕</button>
      <button onclick="changeQty(${index}, -1)">➖</button>
    `;

    list.appendChild(li);
    sum += item.price * item.qty;
  });

  total.textContent = "Total: ₹" + sum;

  localStorage.setItem("cart", JSON.stringify(cart));
}

function changeQty(index, change) {
  cart[index].qty += change;

  if (cart[index].qty <= 0) {
    cart.splice(index, 1);
  }

  updateCart();
}

updateCart();
</script>

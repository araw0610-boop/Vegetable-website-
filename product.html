<!-- CART -->
<h2>My Cart</h2>

<div id="cart-container"></div>

<h3 id="total">Total: ₹0</h3>

<button onclick="clearCart()">Clear Cart</button>
<button onclick="sendWhatsApp()">Order on WhatsApp</button>

<!-- CUSTOMER -->
<h3>Customer Details</h3>

<input type="text" id="name" placeholder="Enter Name"><br><br>
<input type="text" id="address" placeholder="Enter Address"><br><br>
<input type="text" id="mobile" placeholder="Enter Mobile"><br><br>

<!-- SCRIPT -->
<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

function changeQty(name, price, change, image) {

  let found = false;

  for (let i = 0; i < cart.length; i++) {
    if (cart[i].name === name) {
      cart[i].qty += change;

      if (cart[i].qty <= 0) {
        cart.splice(i, 1);
      }

      found = true;
      break;
    }
  }

  if (!found && change > 0) {
    cart.push({ name: name, price: price, qty: 1, image: image });
  }

  updateCart();
}

function updateCart() {

  let container = document.getElementById("cart-container");
  let total = document.getElementById("total");

  container.innerHTML = "";
  let sum = 0;

  cart.forEach((item, index) => {

    let div = document.createElement("div");
    div.className = "cart-item";

    div.innerHTML = `
      <img src="${item.image}" width="50">
      <span>${item.name} (${item.qty})</span>
      <span>₹${item.price * item.qty}</span>
      <button onclick="removeItem(${index})">❌</button>
    `;

    container.appendChild(div);

    sum += item.price * item.qty;
  });

  total.innerText = "Total: ₹" + sum;
  localStorage.setItem("cart", JSON.stringify(cart));
}

function removeItem(index) {
  cart.splice(index, 1);
  updateCart();
}

function clearCart() {
  cart = [];
  updateCart();
}

function searchProduct() {
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.getElementsByClassName("card");
  let found = false;

  for (let i = 0; i < cards.length; i++) {
    let title = cards[i].getElementsByTagName("h3")[0].innerText.toLowerCase();

    if (title.includes(input)) {
      cards[i].style.display = "block";
      found = true;
    } else {
      cards[i].style.display = "none";
    }
  }

  document.getElementById("noResult").style.display = found ? "none" : "block";
}

function sendWhatsApp() {

  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;
  let mobile = document.getElementById("mobile").value;

  if (!name || !address || !mobile) {
    alert("Please fill all details");
    return;
  }

  if (cart.length === 0) {
    alert("Cart empty hai");
    return;
  }

  let message = "🛒 *Order Summary* %0A%0A";

  let total = 0;

  cart.forEach(item => {
    let itemTotal = item.price * item.qty;
    total += itemTotal;

    message += "• " + item.name + " x " + item.qty + " = ₹" + itemTotal + "%0A";
  });

  message += "%0A--------------------%0A";
  message += " *Total: ₹" + total + "*%0A%0A";

  message += "Name: " + name + "%0A";
  message += " Address: " + address + "%0A";
  message += "Mobile: " + mobile;

  let phone = "918400073204"; // apna number daalo

  window.open("https://wa.me/" + phone + "?text=" + message);
}
updateCart();

</script>
